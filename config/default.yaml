backbone:
  lightgcn:
    dropout: 0.0
    n_layers: 3
  neumf:
    mlp_layers:
    - 128
    - 64
    - 32
    pretrain: false
  vaecf:
    anneal_cap: 0.2
    decoder_hidden_dims:
    - 200
    dropout: 0.5
    encoder_hidden_dims:
    - 600
    - 200
    total_anneal_steps: 200000
baseline:
  ada2fair:
    delta: 1.0e-06
    lambda_item: 0.1
    lambda_user: 0.1
    provider_eta: 1.0
    top_k: 100
    user_batch_size: 512
    user_eta: 1.0
  cpfair:
    alpha: 0.5
    utility_weight: 0.8
  dpr:
    alpha_adv: 0.01
    lambda_dpr: 0.1
    reg_s: 0.0001
  fair:
    eta: 0.01
    lambda_item: 0.1
    lambda_user: 0.1
  fairdual:
    lambda_dual: 0.1
  fairsort:
    min_utility: 0.8
    search_steps: 6
  multifr:
    lambda_item: 0.1
    lambda_user: 0.1
  popularity_ips:
    alpha: 0.5
    max_weight: 10.0
  ufr:
    delta: 0.05
dataset:
  demo:
    min_item_interactions: 1
    min_user_interactions: 3
  epinions:
    min_item_interactions: 5
    min_user_interactions: 5
  gowalla:
    min_item_interactions: 20
    min_user_interactions: 15
  movielens:
    min_item_interactions: 5
    min_user_interactions: 5
dual2fair:
  adv_ratio: 0.05
  fusion_alpha: 0.5
  rho_u: 0.5
  rho_v: 0.5
  n_clusters: 64
  sinkhorn_epsilon: 0.1
  sinkhorn_max_iter: 100
  sinkhorn_convergence_tol: 0.001
  transport_backend: landmark
  item_target_mode: merit_uniform_mixture
  merit_uniform_gamma: 0.5
  max_ot_items: 4096
  item_anchor_count: 256
  user_chunk_size: 4096
  ot_update_interval: 1
  merit_user_sample_size: 1024
  merit_item_sample_size: 2048
  merit_user_batch_size: 64
  optimization_mode: mirror_alternating
  bilevel_beta: 3
  mirror_alpha1: 1.0
  mirror_alpha2: 0.1
evaluation:
  adv_ratio: 0.05
  dif_mode: affine_invariant
  max_full_eval_scores: 50000000
  n_neg_sampled: 99
  num_repeats: 1
  top_k: 10
  uif_w1: 0.5
  uif_w2: 0.5
seeds:
  data_split: 2026
  negative_sampling: 42
  model: 42
  ot_sampling: 42
  evaluation: 42
general:
  gpu: 0
  num_workers: 4
  seed: 42
grid_search:
  ndcg_drop_tolerance: 0.01
  lambda1_range:
  - 0.01
  - 0.05
  - 0.1
  - 0.5
  - 1
  - 10
  lambda2_range:
  - 0.01
  - 0.05
  - 0.1
  - 0.5
  - 1
  - 10
model:
  batch_size: 4096
  early_stop_patience: 50
  embedding_dim: 64
  gradient_clip_val: 1.0
  init_method: xavier
  learning_rate: 0.001
  max_epochs: 200
  n_neg: 1
  n_neg_bce: 4
  optimizer: adam
  warmup_ratio: 0.1
  weight_decay: 1.0e-05
